[project]
name = "phase-lora"
version = "0.1.0"
description = "Does writing LoRA's factors in polar coordinates change how it trains? A matched-parameter comparison against LoRA, PoLAR and StelLA."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.9",
    "transformers>=5.0",
    "datasets>=4.0",
    "peft>=0.17",
    "accelerate>=1.0",
    "triton>=3.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
