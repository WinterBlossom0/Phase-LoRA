[project]
name = "phase-lora"
version = "0.1.0"
description = "Adapter factors in polar coordinates: phase versions of LoRA, DoRA and PoLAR at equal parameter count."
requires-python = ">=3.13"
# exact versions of the environment that trained and scored every run of the paper
dependencies = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.27.0",
    "datasets==5.0.1",
    "peft==0.20.0",
    "accelerate==1.14.0",
    "triton==3.7.1; sys_platform == 'linux'",
    "sacrebleu==2.6.0",
    "numpy==2.4.6",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

# torch 2.13.0 with CUDA 13.0, as the runs used
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
